<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" href="/logo.32cf2df4.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.e86aaa02.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>Token API</title>
    <meta name="title" content="Token API" />
    <meta
      name="description"
      content="Unified AI API gateway and admin dashboard."
    />

    <meta name="theme-color" content="#020817" />
    <script>
      (function () {
        try {
          var match = document.cookie.match(/(?:^|; )vite-ui-theme=([^;]*)/)
          var theme = match ? decodeURIComponent(match[1]) : 'dark'
          var resolved =
            theme === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : theme === 'light'
                ? 'light'
                : 'dark'
          document.documentElement.classList.remove('light', 'dark')
          document.documentElement.classList.add(resolved)
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) {
            meta.setAttribute(
              'content',
              resolved === 'dark' ? '#020817' : '#fff'
            )
          }
        } catch (e) {}
      })()
    </script>
    <!--umami-->
    <!--Google Analytics-->
    <style>
      #boot-oauth-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #020817;
        color: #94a3b8;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #boot-oauth-loader[hidden] {
        display: none !important;
      }
      .boot-oauth-spinner {
        width: 2.5rem;
        height: 2.5rem;
        border: 3px solid rgba(148, 163, 184, 0.25);
        border-top-color: #94a3b8;
        border-radius: 9999px;
        animation: boot-oauth-spin 0.8s linear infinite;
      }
      .boot-oauth-text {
        margin: 0;
        font-size: 0.875rem;
      }
      @keyframes boot-oauth-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div id="boot-oauth-loader" hidden>
      <div class="boot-oauth-spinner" aria-hidden="true"></div>
      <p class="boot-oauth-text">Signing in…</p>
    </div>
    <div id="root" translate="no" class="notranslate"></div>
    <script>
      ;(function () {
        // Avoid regex literals here — escape mistakes break this boot script silently.
        if (window.location.pathname.indexOf('/oauth/') !== 0) return
        var loader = document.getElementById('boot-oauth-loader')
        if (loader) loader.hidden = false
      })()
    </script>
  </body>
</html>
